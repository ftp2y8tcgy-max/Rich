name: Trading-Bot

on:
  schedule:
    # Mo–Fr 15:37 UTC = 10:37 New York (Winter) / 11:37 (Sommer), also während der Handelszeit
    - cron: "37 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Tageslauf (Paper Trading)
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 -m bot.run

      - name: Bericht speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add bot/state.json REPORT.md
          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "Bericht $(date -u +%F)"
            git push
          fi
